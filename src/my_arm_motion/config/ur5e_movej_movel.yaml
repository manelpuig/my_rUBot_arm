sequence_name: ur5e_movej_movel_example

defaults:
  target_frame: base_link
  max_velocity: 0.1
  max_acceleration: 0.1
  avoid_collisions: true
  wait_after_sec: 0.0

motions:
  - name: approach
    motion_type: movej
    target_xyz_mm: [0.0, -400.0, 450.0]
    target_rpy_deg: [90.0, 0.0, 0.0]

  - name: move_down
    motion_type: movel
    target_xyz_mm: [0.0, -400.0, 400.0]
    target_rpy_deg: [90.0, 0.0, 0.0]
    max_step: 0.005
    fraction_threshold: 1.0
    jump_threshold: 0.0
    wait_after_sec: 1.0

  - name: retreat
    motion_type: movel
    target_xyz_mm: [0.0, -400.0, 450.0]
    target_rpy_deg: [90.0, 0.0, 0.0]
    max_step: 0.005
    fraction_threshold: 1.0
    jump_threshold: 0.0
